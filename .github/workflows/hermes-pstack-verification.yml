name: Hermes pstack verification
on:
  push:
    paths: ['hermes/**', '.github/workflows/hermes-pstack-verification.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Stdlib unit tests
        run: python3 -m unittest discover -s hermes/tests -v
      - name: Negative gates
        run: python3 -m unittest discover -s hermes/tests -p 'test_negative.py' -v
      - name: Actual CLI examples
        run: python3 -m unittest discover -s hermes/tests -p 'test_cli.py' -v
